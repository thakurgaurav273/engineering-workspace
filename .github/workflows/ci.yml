name: CI

# Monorepo CI: lint + typecheck/build + tests for every workspace on every PR and on main.
# Blocks merge on a red pipeline. Runtime services (Postgres, R2) are intentionally not
# provisioned here; unit tests must not depend on external infra.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (workspace root)
        run: npm ci
      - name: Prisma generate
        run: npm run api:db:generate
      - name: Lint
        run: npm run lint --workspace @grovyn/api
      - name: Build (typecheck)
        run: npm run api:build
      - name: Test
        run: npm run api:test

  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (workspace root)
        run: npm ci
      - name: Typecheck
        run: npm run web:typecheck
      - name: Lint
        run: npm run web:lint
      - name: Build
        run: npm run web:build
